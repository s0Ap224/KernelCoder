[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernelcoder"
version = "0.1.0"
description = "Readable AI coding agent with staged workspaces and reviewed writeback. Works with any compatible LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
maintainers = [
    { name = "s0Ap224" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "e2b==2.56.0",
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kernelcoder"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
kernelcoder = "kernelcoder.cli:main"

[project.urls]
Homepage = "https://github.com/s0Ap224/KernelCoder"
Repository = "https://github.com/s0Ap224/KernelCoder"
Issues = "https://github.com/s0Ap224/KernelCoder/issues"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.hatch.build.targets.sdist]
include = ["/kernelcoder", "/tests", "/scripts", "/requirements", "/examples", "/docs", "/sandbox", "/article", "/LICENSE", "/README.md", "/README_CN.md", "/.env.example", "/pyproject.toml"]
